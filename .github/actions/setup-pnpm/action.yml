name: Set up Node and pnpm
description: >-
  Installs Node from .nvmrc and pnpm from packageManager, then checks that the pnpm on PATH is the
  native binary recorded in pnpm-lock.yaml (spec 0001, R8).
inputs:
  directory:
    description: Checkout that holds .nvmrc, package.json, pnpm-lock.yaml and the scripts.
    default: .
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: ${{ inputs.directory }}/.nvmrc
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        package_json_file: ${{ inputs.directory }}/package.json
    - name: Verify pnpm against packageManager and the lockfile
      shell: bash
      working-directory: ${{ inputs.directory }}
      run: node tooling/scripts/src/verify-pnpm.ts
