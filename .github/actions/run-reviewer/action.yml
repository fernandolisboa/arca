name: Run one reviewer
description: >-
  Runs one reviewer with the Claude Code Action on a prepared review input, read-only, and writes
  its structured output to a file (spec 0001, R10; ADR-0013). The caller checks out main's
  instruction files and .github/policy/gitleaks.toml into the workspace and puts the review input
  at ./review-input.
inputs:
  prompt-file:
    description: The reviewer's prompt, written by the prepare step.
    required: true
  schema-file:
    description: The JSON schema for the reviewer's output.
    required: true
  model:
    description: The reviewer's model alias, or the model ID its repository variable pins it to.
    required: true
  effort:
    description: The reviewer's effort level, or empty.
    default: ''
  output-file:
    description: >-
      Where to write the structured output. No file is left when the run produced none or the
      output matched the secret scan, and the step fails.
    required: true
  expect-categories:
    description: >-
      For the canary, a JSON list of categories. A run without a blocking finding of every one is
      retried once.
    default: ''
  claude-code-oauth-token:
    description: The Claude subscription token from the review environment.
    required: true
  github-token:
    description: The job's read-only token.
    required: true
  allow-dispatch-bot:
    description: >-
      'true' for a canary run on main dispatched by review-canary-push.yml, whose actor is
      github-actions[bot]; the action otherwise refuses bot actors outside allowed_bots.
    default: 'false'
runs:
  using: composite
  steps:
    # The action prints the model's whole transcript when debug logging is on, and logs are public.
    - name: Refuse to run with debug logging
      if: runner.debug == '1'
      shell: bash
      run: |
        echo "::error::The review gate does not run with debug logging on."
        exit 1
    - name: Load the prompt, schema, model and arguments
      id: load
      shell: bash
      env:
        PROMPT_FILE: ${{ inputs.prompt-file }}
        SCHEMA_FILE: ${{ inputs.schema-file }}
        MODEL: ${{ inputs.model }}
        EFFORT: ${{ inputs.effort }}
        ALLOW_DISPATCH_BOT: ${{ inputs.allow-dispatch-bot }}
      run: |
        if [[ ! "$MODEL" =~ ^[a-z0-9][a-z0-9.-]{0,99}$ ]]; then
          echo "::error::The model alias or pinned model ID is missing or malformed."
          exit 1
        fi
        [[ -z "$EFFORT" || "$EFFORT" =~ ^(low|medium|high|xhigh|max)$ ]]
        test -d review-input
        schema="$(jq -c . "$SCHEMA_FILE")"
        # The schema goes inside single quotes in the arguments below.
        if [[ "$schema" == *"'"* ]]; then
          echo "::error::The output schema contains a single quote."
          exit 1
        fi
        # Read-only: Read, Grep and Glob, within the workspace, with no hooks, MCP servers, skills,
        # plugins or memory. Only main's CLAUDE.md loads as project settings.
        settings='{"disableAllHooks":true,"autoMemoryEnabled":false,"includeGitInstructions":false,"disableBundledSkills":true,"disableClaudeAiConnectors":true,"enableAllProjectMcpServers":false,"permissions":{"blockReadsOutsideWorkingDirectories":true,"deny":["Read(./.git/**)","Read(./**/.git/**)","Read(//proc/**)","Read(//sys/**)","Read(//tmp/**)","Read(~/.claude/**)","Read(~/work/_temp/**)"]}}'
        allowed_bots=claude,dependabot
        if [[ "$ALLOW_DISPATCH_BOT" == true ]]; then allowed_bots+=,github-actions; fi
        echo "allowed-bots=$allowed_bots" >> "$GITHUB_OUTPUT"
        delimiter="REVIEWER_$(openssl rand -hex 16)"
        {
          echo "prompt<<$delimiter"
          cat "$PROMPT_FILE"
          echo "$delimiter"
          echo "claude-args<<$delimiter"
          echo "--model $MODEL${EFFORT:+ --effort $EFFORT}"
          echo "--setting-sources project"
          echo "--strict-mcp-config"
          echo "--mcp-config '{\"mcpServers\":{}}'"
          echo "--disable-slash-commands"
          echo "--max-turns 80"
          echo "--tools Read,Grep,Glob"
          echo "--allowedTools Read,Grep,Glob"
          echo "--disallowedTools Bash,Write,Edit,NotebookEdit,WebFetch,WebSearch,Task,Agent,mcp__*"
          echo "--settings '$settings'"
          echo "--json-schema '$schema'"
          echo "$delimiter"
        } >> "$GITHUB_OUTPUT"
    # Before any model runs, so no output can exist unless the scan below can run.
    - name: Download gitleaks, pinned by checksum
      id: gitleaks
      uses: ./.github/actions/setup-gitleaks
    # A failed attempt leaves no output, which the verdict and the canary count as a failure.
    - name: Review
      id: review
      continue-on-error: true
      uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 # v1.0.262
      with:
        claude_code_oauth_token: ${{ inputs.claude-code-oauth-token }}
        github_token: ${{ inputs.github-token }}
        allowed_bots: ${{ steps.load.outputs.allowed-bots }}
        prompt: ${{ steps.load.outputs.prompt }}
        show_full_output: 'false'
        display_report: 'false'
        classify_inline_comments: 'false'
        claude_args: ${{ steps.load.outputs.claude-args }}
    - name: Save the structured output
      shell: bash
      env:
        OUTPUT: ${{ steps.review.outputs.structured_output }}
        OUTPUT_FILE: ${{ inputs.output-file }}
      run: |
        mkdir -p "$(dirname "$OUTPUT_FILE")"
        rm -f "$OUTPUT_FILE"
        if [[ -n "$OUTPUT" ]]; then printf '%s' "$OUTPUT" > "$OUTPUT_FILE"; fi
    # A looser form of judgeCanaryRun in tooling/scripts/src/review-gate/canary.ts, which judges
    # the final output with the schema; this only decides whether to retry.
    - name: Check for a blocking finding of every expected category
      id: check
      if: inputs.expect-categories != ''
      shell: bash
      env:
        CATEGORIES: ${{ inputs.expect-categories }}
        OUTPUT_FILE: ${{ inputs.output-file }}
      run: |
        if jq -e --argjson categories "$CATEGORIES" \
          '[.findings[] | select(.severity | IN("critical", "high", "medium")) | .category] as $found
           | $categories | all(. as $category | $found | index($category) != null)' \
          "$OUTPUT_FILE" > /dev/null 2>&1; then
          echo "retry=false" >> "$GITHUB_OUTPUT"
        else
          echo "retry=true" >> "$GITHUB_OUTPUT"
        fi
    - name: Retry once
      id: retry
      if: steps.check.outputs.retry == 'true'
      continue-on-error: true
      uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 # v1.0.262
      with:
        claude_code_oauth_token: ${{ inputs.claude-code-oauth-token }}
        github_token: ${{ inputs.github-token }}
        allowed_bots: ${{ steps.load.outputs.allowed-bots }}
        prompt: ${{ steps.load.outputs.prompt }}
        show_full_output: 'false'
        display_report: 'false'
        classify_inline_comments: 'false'
        claude_args: ${{ steps.load.outputs.claude-args }}
    - name: Save the retry's structured output
      if: steps.check.outputs.retry == 'true'
      shell: bash
      env:
        OUTPUT: ${{ steps.retry.outputs.structured_output }}
        OUTPUT_FILE: ${{ inputs.output-file }}
      run: |
        rm -f "$OUTPUT_FILE"
        if [[ -n "$OUTPUT" ]]; then printf '%s' "$OUTPUT" > "$OUTPUT_FILE"; fi
    # The output is uploaded as an artifact anyone with read access can download, so it is scanned
    # first; on a match it is dropped and the reviewer counts as missing.
    - name: Scan the output for secrets and require it
      shell: bash
      env:
        GITLEAKS: ${{ steps.gitleaks.outputs.path }}
        OUTPUT_FILE: ${{ inputs.output-file }}
      run: |
        if [[ ! -s "$OUTPUT_FILE" ]]; then
          echo "::error::The reviewer produced no structured output."
          exit 1
        fi
        if ! "$GITLEAKS" dir "$OUTPUT_FILE" --config=.github/policy/gitleaks.toml --redact --no-banner; then
          rm -f "$OUTPUT_FILE"
          echo "::error::The reviewer's output matched the secret scan and was dropped."
          exit 1
        fi
