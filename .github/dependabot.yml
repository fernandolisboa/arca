# Version updates (spec 0001, R8). The 7-day cooldown matches pnpm's minimumReleaseAge, so an
# update never proposes a release that the lockfile-policy check's release-age rule would reject.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    versioning-strategy: increase
    groups:
      npm:
        patterns: ['*']
    # One WebAuthn verifier in the tree (ADR-0015): SimpleWebAuthn stays on the major the passkey
    # plugin resolves. Drop this entry in the pull request that moves the plugin to the next major.
    ignore:
      - dependency-name: '@simplewebauthn/*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
