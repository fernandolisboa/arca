# Advisory exceptions for the osv-scanner job, read from main (spec 0001, R8). Each needs a reason
# and an end date; adding one is its own pull request.

[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
ignoreUntil = 2027-01-31T00:00:00Z
reason = "The minimatch 10.2.6 denial of service needs optimizationLevel 2 or higher and a pattern an attacker supplies. The default is 1, and none of the five packages that bring minimatch sets the option or takes a pattern from a request: eslint, @eslint/config-array and @typescript-eslint/typescript-estree run at lint time; @oclif/core loads only when the Workflow CLI is run by hand, which no build or CI step does; @vercel/queue calls it only in local development, never in a deployment, on file patterns from the project's own vercel.json. The fix is minimatch 11.0.1, a major release, and there is no fixed 10.x. The latest releases still require ^10 (eslint 10.14.0, @eslint/config-array 0.23.5, @typescript-eslint/typescript-estree 8.72.2, @vercel/queue 0.11.0), and @workflow/cli 5.1.0 pins @oclif/core 4.11.4, which also requires ^10; @oclif/core accepts ^11 only from 5.1.12 (npm registry, checked 2026-11-11). Remove this entry once the lockfile no longer has minimatch 10."
