# gitleaks configuration, read from main (spec 0001, R8): the default rules plus the one below,
# nothing allow-listed.
title = "arca"

[extend]
useDefault = true

# The default rules cover Anthropic API and admin keys only. The review gate holds a Claude Code
# OAuth token (ADR-0013), so match every Anthropic token prefix, that one included.
[[rules]]
id = "anthropic-token"
description = "An Anthropic token of any kind, such as a Claude Code OAuth token."
regex = '''(?:^|[^A-Za-z0-9])(sk-ant-[a-z0-9]+-[A-Za-z0-9_\-]{20,})'''
# Placeholders such as `sk-ant-oat01-xxxx…` in a reviewer's finding are not secrets.
entropy = 3.5
keywords = ["sk-ant-"]

[[rules]]
id = "arca-corrector-key"
description = "Arca's corrector key, which the scheduled corrector run sends to the app (ADR-0029)."
regex = '''(?:^|[^A-Za-z0-9])(arca_ck_[A-Za-z0-9_\-]{43})'''
entropy = 3.5
keywords = ["arca_ck_"]
