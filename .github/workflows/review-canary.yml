name: review-canary

# Known-bad and injected changes from eval/review-gate/ that every target reviewer must fail
# (spec 0001, R10; ADR-0013). A pass on main is recorded as an artifact named for the gate
# fingerprint, which the review gate requires. Called from the gate, it runs a change's own
# reviewer definitions instead, and its result goes into that pull request's verdict. A push to
# main reaches it through review-canary-push.yml, since the reviewer action rejects push events.
# A slim run covers one known-bad case per reviewer; the weekly run covers the whole corpus.

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      skip-if-passed:
        description: Stop when a pass for the current gate fingerprint exists.
        type: boolean
        default: false
      scope:
        description: >-
          full runs the whole corpus; slim runs one known-bad case per reviewer, and fails when a
          canary run on main failed after the last success.
        type: choice
        options: [full, slim]
        default: full
  workflow_call:
    inputs:
      change-agents:
        description: Run the reviewer definitions from the calling pull request's head commit.
        type: boolean
        default: false
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

permissions: {}

# A pending run is replaced by a newer one in its group, so slim runs dispatched for pushes queue
# apart from full runs: a push never replaces a pending weekly run (ADR-0013).
concurrency:
  group: >-
    review-canary-${{ github.event.pull_request.number || 'main' }}-${{
    (github.event_name == 'workflow_dispatch' && github.actor != github.repository_owner)
    && 'slim' || 'full' }}
  cancel-in-progress: false

env:
  TURBO_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has-runs: ${{ steps.plan.outputs.has-runs }}
      skip: ${{ steps.plan.outputs.skip }}
      fingerprint: ${{ steps.plan.outputs.fingerprint }}
    env:
      # A dispatch by anyone but the owner, such as review-canary-push.yml, never forces a run
      # while a pass exists, and runs slim (ADR-0013). This assumes a user-owned repository.
      OTHER_DISPATCH: >-
        ${{ github.event_name == 'workflow_dispatch' && github.actor != github.repository_owner }}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - name: Install the scripts from main
        run: pnpm install --frozen-lockfile --filter @arca/scripts
      # Called from the gate: the change's commit is fetched as objects only, into a bare repository
      # outside the checkout, and its reviewer definitions are parsed from there. The fetch is
      # anonymous, which works while the repository is public; if it goes private, it fails closed.
      - name: Fetch the change (data only)
        if: inputs.change-agents
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init --quiet --bare "$RUNNER_TEMP/change.git"
          git -C "$RUNNER_TEMP/change.git" fetch --quiet --no-tags --no-recurse-submodules \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$HEAD_SHA"
      - name: Plan the cases
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CHANGE_HEAD: ${{ inputs.change-agents && github.event.pull_request.head.sha || '' }}
          SKIP_IF_PASSED: >-
            ${{ (inputs.skip-if-passed || env.OTHER_DISPATCH == 'true') && '--skip-if-passed' || '' }}
          SCOPE: ${{ env.OTHER_DISPATCH == 'true' && 'slim' || inputs.scope || 'full' }}
          REVIEW_MODEL_FABLE: ${{ vars.REVIEW_MODEL_FABLE }}
          REVIEW_MODEL_OPUS: ${{ vars.REVIEW_MODEL_OPUS }}
          REVIEW_MODEL_HAIKU: ${{ vars.REVIEW_MODEL_HAIKU }}
        run: >-
          node tooling/scripts/src/review-gate/cli.ts canary-plan
          --out "$RUNNER_TEMP/canary" --scratch "$RUNNER_TEMP/worktrees" --scope "$SCOPE"
          ${CHANGE_HEAD:+--change-objects "$RUNNER_TEMP/change.git" --change-head "$CHANGE_HEAD"}
          $SKIP_IF_PASSED
      - name: Upload the plan
        if: steps.plan.outputs.skip != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canary-plan
          path: ${{ runner.temp }}/canary
          if-no-files-found: error
          retention-days: 7

  run:
    needs: plan
    if: needs.plan.outputs.skip != 'true' && needs.plan.outputs.has-runs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: review
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      # A re-run reads the model variables again, so its models may differ from the plan's
      # fingerprint; a passing re-run would also erase the failure that revokes older passes
      # (ADR-0013). On main, recover by dispatching a new run.
      - name: Refuse a re-run on main
        if: github.event_name != 'pull_request_target'
        run: |
          if [[ "$GITHUB_RUN_ATTEMPT" != 1 ]]; then
            echo "::error::Re-runs of the canary on main do not count. Dispatch a new run instead."
            exit 1
          fi
      - name: Check out main's instruction files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /CLAUDE.md
            /docs/REVIEW.md
            /docs/SECURITY.md
            /.github/actions/
            /.github/policy/gitleaks.toml
      - name: Download the plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: canary-plan
          path: ${{ runner.temp }}/canary
      - name: Put the case's review input in the workspace
        env:
          CASE: ${{ matrix.case }}
        run: |
          [[ "$CASE" =~ ^[a-z0-9][a-z0-9-]*$ ]]
          mv "$RUNNER_TEMP/canary/cases/$CASE/review-input" review-input
      - uses: ./.github/actions/run-reviewer
        with:
          prompt-file: ${{ runner.temp }}/canary/cases/${{ matrix.case }}/prompts/${{ matrix.reviewer }}.md
          schema-file: ${{ runner.temp }}/canary/schema.json
          model: ${{ vars[matrix.modelVariable] || matrix.model }}
          effort: ${{ matrix.effort }}
          output-file: ${{ runner.temp }}/out/${{ matrix.case }}/${{ matrix.reviewer }}.json
          expect-categories: ${{ toJSON(matrix.categories) }}
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github-token: ${{ github.token }}
          allow-dispatch-bot: >-
            ${{ github.event_name == 'workflow_dispatch' && github.actor == 'github-actions[bot]' }}
      - name: Upload the output
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canary-output-${{ matrix.case }}-${{ matrix.reviewer }}
          path: ${{ runner.temp }}/out
          if-no-files-found: ignore
          retention-days: 7

  evaluate:
    needs: [plan, run]
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      # A re-run reads the model variables again, so its models may differ from the plan's
      # fingerprint; a passing re-run would also erase the failure that revokes older passes
      # (ADR-0013). On main, recover by dispatching a new run.
      - name: Refuse a re-run on main
        if: github.event_name != 'pull_request_target'
        run: |
          if [[ "$GITHUB_RUN_ATTEMPT" != 1 ]]; then
            echo "::error::Re-runs of the canary on main do not count. Dispatch a new run instead."
            exit 1
          fi
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - name: Install the scripts from main
        run: pnpm install --frozen-lockfile --filter @arca/scripts
      - name: Download the plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: canary-plan
          path: ${{ runner.temp }}/canary
      - name: Download the outputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: canary-output-*
          merge-multiple: true
          path: ${{ runner.temp }}/out
      - name: Judge every case
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ALERT: ${{ !inputs.change-agents && '--alert' || '' }}
        run: >-
          node tooling/scripts/src/review-gate/cli.ts canary-evaluate
          --plan "$RUNNER_TEMP/canary/plan.json" --outputs "$RUNNER_TEMP/out"
          --out "$RUNNER_TEMP/result.json" $ALERT
      - name: Upload the result
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canary-result
          path: ${{ runner.temp }}/result.json
          if-no-files-found: error
          retention-days: 7
      # The review gate looks for this artifact by name and checks it came from a successful run of
      # this workflow on main.
      - name: Record the pass for this gate fingerprint
        if: ${{ success() && !inputs.change-agents }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canary-pass-${{ needs.plan.outputs.fingerprint }}
          path: ${{ runner.temp }}/result.json
          if-no-files-found: error
          retention-days: 90
