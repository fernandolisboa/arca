name: intake-eval

# The intake evaluation (spec 0008, R5): runs the synthetic cases against the real model and writes
# the scores to the job summary. Started by hand only, on the ref to test, so it is never a
# required check (ADR-0019). Only people who can run workflows can start it, and they choose the
# ref, so it holds the model key without running anyone else's code.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to evaluate
        required: true
        default: main
        type: string

permissions: {}

env:
  TURBO_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@arca/api^...
      - name: Name the evaluated commit
        env:
          EVAL_REF: ${{ inputs.ref }}
        run: echo "Evaluated \`$EVAL_REF\` at \`$(git rev-parse HEAD)\`." >> "$GITHUB_STEP_SUMMARY"
      - name: Run the intake evaluation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ARCA_EVAL_REPORT: ${{ runner.temp }}/intake-eval.md
        run: |
          status=0
          pnpm --filter @arca/api eval:intake || status=$?
          if [ -f "$ARCA_EVAL_REPORT" ]; then cat "$ARCA_EVAL_REPORT" >> "$GITHUB_STEP_SUMMARY"; fi
          exit "$status"
