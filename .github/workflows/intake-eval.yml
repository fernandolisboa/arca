name: intake-eval

# The AI evaluations: the intake's synthetic cases (spec 0008, R5) and the rule summary of each
# route's newest version (ADR-0025) and the comparison's criterion suggestions (ADR-0034), on the real model, each writing its report to the job summary.
# Started by hand only (`gh workflow run intake-eval --ref <branch>`, `-f only=<evaluation>` to
# spend on one), never a required check (ADR-0019). It evaluates the commit it was dispatched on, a
# branch or tag of this repository, with that commit's own copy of this file; there is no ref
# input, so no fork's code can run here with the key.
on:
  workflow_dispatch:
    inputs:
      only:
        description: Which evaluation to run
        type: choice
        options: [all, intake, rule-summary, criterion-suggestions]
        default: all

permissions: {}

concurrency:
  group: intake-eval
  cancel-in-progress: false

env:
  TURBO_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@arca/api^...
      - name: Name the evaluated commit
        id: named
        env:
          EVAL_REF: ${{ github.ref_name }}
          EVAL_SHA: ${{ github.sha }}
        run: |
          [[ "$EVAL_REF" =~ ^[A-Za-z0-9._/-]+$ && "$EVAL_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "Evaluated \`$EVAL_REF\` at \`$EVAL_SHA\`." >> "$GITHUB_STEP_SUMMARY"
      - name: Run the intake evaluation
        if: ${{ inputs.only == 'all' || inputs.only == 'intake' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ARCA_EVAL_REPORT: ${{ runner.temp }}/intake-eval.md
        run: |
          status=0
          pnpm --fail-if-no-match --filter @arca/api eval:intake || status=$?
          if [ ! -f "$ARCA_EVAL_REPORT" ]; then
            echo "The evaluation wrote no report." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          cat "$ARCA_EVAL_REPORT" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      # The rule summary evaluation runs even when the intake's failed, so one run reports both, but
      # not after a failed install or build.
      - name: Run the rule summary evaluation
        if: ${{ !cancelled() && steps.named.outcome == 'success' && (inputs.only == 'all' || inputs.only == 'rule-summary') }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ARCA_EVAL_REPORT: ${{ runner.temp }}/rule-summary-eval.md
        run: |
          status=0
          pnpm --fail-if-no-match --filter @arca/api eval:rule-summary || status=$?
          if [ ! -f "$ARCA_EVAL_REPORT" ]; then
            echo "The rule summary evaluation wrote no report." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          cat "$ARCA_EVAL_REPORT" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Run the criterion suggestion evaluation
        if: ${{ !cancelled() && steps.named.outcome == 'success' && (inputs.only == 'all' || inputs.only == 'criterion-suggestions') }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ARCA_EVAL_REPORT: ${{ runner.temp }}/criterion-suggestions-eval.md
        run: |
          status=0
          pnpm --fail-if-no-match --filter @arca/api eval:criterion-suggestions || status=$?
          if [ ! -f "$ARCA_EVAL_REPORT" ]; then
            echo "The criterion suggestion evaluation wrote no report." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          cat "$ARCA_EVAL_REPORT" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
