name: policy

# Checks that judge a pull request with this workflow, its scripts and its policy files as they are
# on main (spec 0001, R8). pull_request_target runs the definition from main, so a pull request
# cannot change what runs here. Its files are checked out as data and never executed.

on:
  pull_request_target:
    branches: [main]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

env:
  TURBO_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'

jobs:
  secrets-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out main (workflow, policy and scripts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: policy
          persist-credentials: false
      - uses: ./policy/.github/actions/setup-pnpm
        with:
          directory: policy
      - name: Install the scripts from main
        working-directory: policy
        run: pnpm install --frozen-lockfile --filter @arca/scripts
      # Last, so no earlier step can read the change; nothing runs from it. Keep it after every
      # install or build step, above all if this job ever gains a secret.
      - name: Check out the change (data only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: change
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/
            .github/actions/
      - name: Lint workflow secrets
        run: >-
          node policy/tooling/scripts/src/check-workflow-secrets.ts
          policy/.github/policy/workflow-secrets.json
          change/.github/workflows
          change/.github/actions

  lockfile-policy:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out main (workflow, policy and scripts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: policy
          persist-credentials: false
      - uses: ./policy/.github/actions/setup-pnpm
        with:
          directory: policy
      - name: Install the scripts from main
        working-directory: policy
        run: pnpm install --frozen-lockfile --filter @arca/scripts
      # After every install step. The change's lockfile is read from git as data; no file of the
      # change is checked out and nothing runs from it.
      - name: Read the change's lockfile (data only)
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          git -C policy fetch --no-tags --depth=1 origin "$HEAD_SHA"
          git -C policy show "$HEAD_SHA:pnpm-lock.yaml" > "$RUNNER_TEMP/change-lock.yaml"
      - name: Check release age against main's settings
        run: >-
          node policy/tooling/scripts/src/check-release-age.ts
          policy/pnpm-workspace.yaml
          policy/pnpm-lock.yaml
          "$RUNNER_TEMP/change-lock.yaml"
      # GitHub's dependency graph does not read pnpm 12's two-document lockfile, so dependency
      # review would pass without judging anything; licenses come from the registry instead.
      - name: Check licenses against main's policy
        if: ${{ !cancelled() }}
        run: >-
          node policy/tooling/scripts/src/check-licenses.ts
          policy/.github/policy/licenses.json
          policy/pnpm-lock.yaml
          "$RUNNER_TEMP/change-lock.yaml"

  osv-scanner:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      OSV_SCANNER_VERSION: 2.7.0
      OSV_SCANNER_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
    steps:
      - name: Check out main's policy files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: policy
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /.github/policy/
      - name: Download osv-scanner, pinned by checksum
        run: |
          curl -fsSL -o "$RUNNER_TEMP/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  $RUNNER_TEMP/osv-scanner" | sha256sum --check --strict -
          chmod +x "$RUNNER_TEMP/osv-scanner"
      # The change's lockfile is read from git as data; no file of the change is checked out.
      - name: Read the change's lockfile (data only)
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          git -C policy fetch --no-tags --depth=1 origin "$HEAD_SHA"
          mkdir "$RUNNER_TEMP/change"
          git -C policy show "$HEAD_SHA:pnpm-lock.yaml" > "$RUNNER_TEMP/change/pnpm-lock.yaml"
      - name: Scan the lockfile with main's exceptions
        run: >-
          "$RUNNER_TEMP/osv-scanner" scan source
          --config=policy/.github/policy/osv-scanner.toml
          --lockfile="$RUNNER_TEMP/change/pnpm-lock.yaml"

  gitleaks:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # The pull request's commits are fetched into main's repository and scanned there, so there is
      # no worktree from the change: its .gitleaksignore and .gitattributes never take effect.
      - name: Check out main's policy files and actions, with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: policy
          persist-credentials: false
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/policy/
            /.github/actions/
      - name: Download gitleaks, pinned by checksum
        id: gitleaks
        uses: ./policy/.github/actions/setup-gitleaks
      # --text and --remerge-diff show content that attributes would hide as binary and content
      # added only in a merge commit. Inline gitleaks:allow comments are not honored.
      - name: Scan the pull request's commits with main's configuration
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITLEAKS: ${{ steps.gitleaks.outputs.path }}
        run: |
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          git -C policy fetch --no-tags origin "$HEAD_SHA"
          "$GITLEAKS" git policy \
            --log-opts="--text --remerge-diff --no-ext-diff --no-textconv ${BASE_SHA}..${HEAD_SHA}" \
            --config=policy/.github/policy/gitleaks.toml \
            --gitleaks-ignore-path=policy/.github/policy/gitleaks-ignore \
            --ignore-gitleaks-allow \
            --redact \
            --no-banner
