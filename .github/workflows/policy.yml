name: policy

# Checks that judge a pull request with this workflow, its scripts and its policy files as they are
# on main (spec 0001, R8). pull_request_target runs the definition from main, so a pull request
# cannot change what runs here. Its files are checked out as data and never executed.

on:
  pull_request_target:
    branches: [main]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

env:
  TURBO_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'

jobs:
  secrets-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out main (workflow, policy and scripts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: policy
          persist-credentials: false
      - uses: ./policy/.github/actions/setup-pnpm
        with:
          directory: policy
      - name: Install the scripts from main
        working-directory: policy
        run: pnpm install --frozen-lockfile --filter @arca/scripts
      # Last, so no earlier step can read the change; nothing runs from it. Keep it after every
      # install or build step, above all if this job ever gains a secret.
      - name: Check out the change (data only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: change
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/
            .github/actions/
      - name: Lint workflow secrets
        run: >-
          node policy/tooling/scripts/src/check-workflow-secrets.ts
          policy/.github/policy/workflow-secrets.json
          change/.github/workflows
          change/.github/actions

  release-age:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out main (workflow, policy and scripts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: policy
          persist-credentials: false
      - uses: ./policy/.github/actions/setup-pnpm
        with:
          directory: policy
      - name: Install the scripts from main
        working-directory: policy
        run: pnpm install --frozen-lockfile --filter @arca/scripts
      - name: Check out the change's lockfile (data only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: change
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /pnpm-lock.yaml
      - name: Check release age against main's settings
        run: >-
          node policy/tooling/scripts/src/check-release-age.ts
          policy/pnpm-workspace.yaml
          policy/pnpm-lock.yaml
          change/pnpm-lock.yaml

  osv-scanner:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      OSV_SCANNER_VERSION: 2.7.0
      OSV_SCANNER_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
    steps:
      - name: Check out main's policy files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: policy
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /.github/policy/
      - name: Download osv-scanner, pinned by checksum
        run: |
          curl -fsSL -o "$RUNNER_TEMP/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  $RUNNER_TEMP/osv-scanner" | sha256sum --check --strict -
          chmod +x "$RUNNER_TEMP/osv-scanner"
      - name: Check out the change's lockfile (data only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: change
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /pnpm-lock.yaml
      - name: Scan the lockfile with main's exceptions
        run: >-
          "$RUNNER_TEMP/osv-scanner" scan source
          --config=policy/.github/policy/osv-scanner.toml
          --lockfile=change/pnpm-lock.yaml

  dependency-review:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Reads the dependency graph diff between the base and head commits; checks out nothing.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          fail-on-scopes: runtime, development, unknown
          allow-licenses: >-
            MIT, ISC, Apache-2.0, BSD-2-Clause, BSD-3-Clause, 0BSD, BlueOak-1.0.0, CC0-1.0,
            CC-BY-4.0, Unlicense, Python-2.0

  gitleaks:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Check out main's policy files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: policy
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /.github/policy/
      - name: Download gitleaks, pinned by checksum
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $archive" | sha256sum --check --strict -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Check out the change with its history (data only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: change
          persist-credentials: false
          fetch-depth: 0
      # The change's .gitleaksignore and inline gitleaks:allow comments are not honored.
      - name: Scan the pull request's commits with main's configuration
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          "$RUNNER_TEMP/gitleaks" git change
          --log-opts="${BASE_SHA}..${HEAD_SHA}"
          --config=policy/.github/policy/gitleaks.toml
          --gitleaks-ignore-path=policy/.github/policy/gitleaks-ignore
          --ignore-gitleaks-allow
          --redact
          --no-banner
