name: policy

# Checks that judge a pull request with scripts and policy files from main, so the pull request
# cannot weaken them (spec 0001, R8).

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: policy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'

jobs:
  secrets-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out main (policy and scripts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: policy
          persist-credentials: false
      - name: Check out the change (data only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: change
          persist-credentials: false
          sparse-checkout: .github/workflows
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: policy/.nvmrc
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: policy/package.json
      - name: Verify pnpm against packageManager
        working-directory: policy
        run: node tooling/scripts/src/verify-pnpm.ts
      - name: Install the scripts from main
        working-directory: policy
        run: pnpm install --frozen-lockfile --filter @arca/scripts
      - name: Lint workflow secrets
        run: >-
          node policy/tooling/scripts/src/check-workflow-secrets.ts
          policy/.github/policy/workflow-secrets.json
          change/.github/workflows
