name: smoke

# Spec 0001, R9: after Vercel deploys main to production, check the live app from outside, with no
# secrets (the production origin is public). Vercel sends repository_dispatch events, which run
# this file as it is on main, never a branch's copy; workflow_dispatch runs it by hand.
on:
  repository_dispatch:
    types: [vercel.deployment.success]
  workflow_dispatch:

permissions: {}

env:
  TURBO_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'
  # Vercel's assigned production alias until the production domain is chosen (docs/OPEN-QUESTIONS.md).
  PRODUCTION_ORIGIN: https://arca-ruddy-five.vercel.app

jobs:
  production:
    if: >-
      github.event_name == 'workflow_dispatch' || (
        github.event.client_payload.project.name == 'arca' &&
        github.event.client_payload.environment == 'production' &&
        (github.event.client_payload.git.ref == 'main' ||
          github.event.client_payload.git.ref == 'refs/heads/main')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@arca/security-policy
      - run: pnpm --fail-if-no-match --filter @arca/scripts smoke "$PRODUCTION_ORIGIN"
