name: review-gate

# The reviewers in .claude/agents/ judge every pull request to main and the report job creates the
# required review-gate check (spec 0001, R10; ADR-0011, ADR-0012, ADR-0013). pull_request_target
# runs this definition from main. No code from the pull request runs: its commits are fetched as
# git objects and reach the reviewers only as wrapped data.

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: review-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'

jobs:
  prepare:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}
      agents-changed: ${{ steps.prepare.outputs.agents-changed }}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - name: Install the scripts from main
        run: pnpm install --frozen-lockfile --filter @arca/scripts
      # After every install step. The change is fetched as objects only, into a bare repository
      # outside the checkout, together with main's commit for the reference docs; nothing of it is
      # checked out or run.
      - name: Fetch the change (data only)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MAIN_SHA: ${{ github.sha }}
        run: |
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ && "$MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init --quiet --bare "$RUNNER_TEMP/change.git"
          git -C "$RUNNER_TEMP/change.git" fetch --quiet --no-tags --no-recurse-submodules \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$MAIN_SHA" "$BASE_SHA" "$HEAD_SHA"
      - name: Prepare the review input
        id: prepare
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MAIN_SHA: ${{ github.sha }}
        run: >-
          node tooling/scripts/src/review-gate/cli.ts prepare
          --objects "$RUNNER_TEMP/change.git" --reference "$MAIN_SHA"
          --base "$BASE_SHA" --head "$HEAD_SHA" --out "$RUNNER_TEMP/gate"
      - name: Upload the review input
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-input
          path: ${{ runner.temp }}/gate
          if-no-files-found: error
          retention-days: 7

  review:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: review
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      # Only the files that carry instructions, main's actions and the secret-scan rules; every
      # other doc reaches the reviewers as data.
      - name: Check out main's instruction files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /CLAUDE.md
            /docs/REVIEW.md
            /docs/SECURITY.md
            /.github/actions/
            /.github/policy/gitleaks.toml
      - name: Download the review input
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: review-input
          path: ${{ runner.temp }}/gate
      - name: Put the review input in the workspace
        run: mv "$RUNNER_TEMP/gate/review-input" review-input
      - uses: ./.github/actions/run-reviewer
        with:
          prompt-file: ${{ runner.temp }}/gate/prompts/${{ matrix.reviewer }}.md
          schema-file: ${{ runner.temp }}/gate/schema.json
          model: ${{ vars[matrix.modelVariable] }}
          effort: ${{ matrix.effort }}
          output-file: ${{ runner.temp }}/output/${{ matrix.reviewer }}.json
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          github-token: ${{ github.token }}
      - name: Upload the reviewer's output
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-output-${{ matrix.reviewer }}
          path: ${{ runner.temp }}/output/${{ matrix.reviewer }}.json
          if-no-files-found: ignore
          retention-days: 7

  # A change to the reviewers runs the canary with its own definitions; a pass there stands in for
  # main's canary result, so a change that repairs the reviewers can merge. A called workflow sees
  # only the secrets its caller passes, even for a job with an environment, so the key is passed
  # by name; GitHub resolves it from the review environment of the called job. The called
  # workflow's jobs may ask for no more than these permissions; issues: write is for its evaluate
  # job, which opens no issue in this mode.
  canary:
    needs: prepare
    if: needs.prepare.outputs.agents-changed == 'true'
    permissions:
      contents: read
      actions: read
      issues: write
    uses: ./.github/workflows/review-canary.yml
    with:
      change-agents: true
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  report:
    needs: [prepare, review, canary]
    # Not on a cancelled run: a newer push superseded it, and its run reports instead.
    if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
      checks: write
      issues: write
      pull-requests: write
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - name: Install the scripts from main
        run: pnpm install --frozen-lockfile --filter @arca/scripts
      - name: Download the review input
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: review-input
          path: ${{ runner.temp }}/gate
      - name: Download the reviewers' outputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: review-output-*
          merge-multiple: true
          path: ${{ runner.temp }}/outputs
      - name: Download the canary result for the change's reviewers
        if: needs.prepare.outputs.agents-changed == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: canary-result
          path: ${{ runner.temp }}/canary
      - name: Compute the verdict
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHANGE_CANARY: ${{ needs.prepare.outputs.agents-changed == 'true' && format('--change-canary={0}/canary/result.json', runner.temp) || '' }}
          REVIEW_MODEL_FABLE: ${{ vars.REVIEW_MODEL_FABLE }}
          REVIEW_MODEL_OPUS: ${{ vars.REVIEW_MODEL_OPUS }}
          REVIEW_MODEL_HAIKU: ${{ vars.REVIEW_MODEL_HAIKU }}
        run: >-
          node tooling/scripts/src/review-gate/cli.ts report
          --input "$RUNNER_TEMP/gate" --outputs "$RUNNER_TEMP/outputs"
          --head "$HEAD_SHA" --pr "$PR_NUMBER" --out "$RUNNER_TEMP/report" $CHANGE_CANARY
      - name: Download gitleaks, pinned by checksum
        id: gitleaks
        uses: ./.github/actions/setup-gitleaks
      - name: Scan the comment for secrets
        id: scan
        env:
          GITLEAKS: ${{ steps.gitleaks.outputs.path }}
        run: >-
          "$GITLEAKS" dir "$RUNNER_TEMP/report/comment.md"
          --config=.github/policy/gitleaks.toml --redact --no-banner
      - name: Create the check run and post the comment
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          WITHHELD: ${{ steps.scan.outcome == 'failure' && '--withheld' || '' }}
        run: >-
          node tooling/scripts/src/review-gate/cli.ts publish
          --report "$RUNNER_TEMP/report" --head "$HEAD_SHA" --pr "$PR_NUMBER" $WITHHELD
