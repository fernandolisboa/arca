packages:
  - apps/*
  - packages/*
  - tooling/*

# Exact versions only; every dependency comes from a catalog.
savePrefix: ''
catalogMode: strict

# Supply chain (spec 0001, R1).
minimumReleaseAge: 10080
strictDepBuilds: true
allowBuilds: {}
trustPolicy: no-downgrade
trustPolicyExclude:
  # Backport for the 6.x line, published 2023-07-10 by a maintainer without provenance, after
  # 7.5.1-7.5.4 had been published with provenance by npm-cli-ops (npm registry, checked
  # 2026-11-01). Pulled in by @babel/core through eslint-plugin-react-hooks, lint only.
  - semver@6.3.1
blockExoticSubdeps: true

overrides:
  # Tailwind pins 1.32.0 while Vite uses 1.33.0. One copy instead of two, and the one whose
  # MPL-2.0 license already has an exception in .github/policy/licenses.json.
  '@tailwindcss/node>lightningcss': 1.33.0

catalog:
  '@hono/zod-openapi': 1.6.3
  '@playwright/test': 1.64.1
  '@tailwindcss/vite': 4.3.3
  '@tanstack/react-query': 5.104.5
  '@tanstack/react-router': 1.170.46
  '@tanstack/router-plugin': 1.168.48
  '@types/node': 26.6.5
  '@types/pg': 8.23.1
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@vitejs/plugin-react': 6.1.2
  drizzle-kit: 1.0.0-rc.5
  drizzle-orm: 1.0.0-rc.5
  eslint: 10.13.0
  hono: 4.13.14
  i18next-icu: 2.6.1
  i18next: 26.5.11
  intl-messageformat: 12.1.4
  libpg-query: 18.2.1
  nitro: 3.0.260903-beta
  pg: 8.23.1
  prettier: 3.9.10
  react-dom: 19.3.1
  react-i18next: 17.1.9
  react: 19.3.1
  tailwindcss: 4.3.3
  turbo: 2.11.10
  typescript: 7.0.2
  vite: 8.3.5
  vitest: 5.0.5
  workbox-core: 7.4.1
  workbox-precaching: 7.4.1
  workbox-routing: 7.4.1
  yaml: 2.9.1
  zod: 4.6.7

catalogs:
  # typescript-eslint needs the compiler API, which TypeScript 7 does not expose as stable yet.
  # Only tooling/eslint-config may use this catalog (spec 0001, R1).
  lint:
    '@eslint-react/eslint-plugin': 5.28.8
    '@eslint/js': 10.0.1
    eslint-plugin-i18next: 6.1.5
    eslint-plugin-react-hooks: 7.1.1
    globals: 17.13.0
    typescript: 6.0.3
    typescript-eslint: 8.72.0
