packages:
  - apps/*
  - packages/*
  - tooling/*

# Exact versions only; every dependency comes from a catalog.
savePrefix: ''
catalogMode: strict

# Supply chain (spec 0001, R1).
minimumReleaseAge: 10080
strictDepBuilds: true
allowBuilds: {}
trustPolicy: no-downgrade
trustPolicyExclude:
  # Backport for the 6.x line, published 2023-07-10 by a maintainer without provenance, after
  # 7.5.1-7.5.4 had been published with provenance by npm-cli-ops (npm registry, checked
  # 2026-11-01). Pulled in by @babel/core through eslint-plugin-react-hooks, lint only.
  - semver@6.3.1
blockExoticSubdeps: true

catalog:
  '@hono/zod-openapi': 1.6.3
  '@types/node': 26.6.5
  '@types/pg': 8.23.1
  drizzle-kit: 1.0.0-rc.5
  drizzle-orm: 1.0.0-rc.5
  eslint: 10.13.0
  hono: 4.13.14
  libpg-query: 18.2.1
  pg: 8.23.1
  prettier: 3.9.10
  turbo: 2.11.10
  typescript: 7.0.2
  vitest: 5.0.5
  yaml: 2.9.1
  zod: 4.6.7

catalogs:
  # typescript-eslint needs the compiler API, which TypeScript 7 does not expose as stable yet.
  # Only tooling/eslint-config may use this catalog (spec 0001, R1).
  lint:
    '@eslint-react/eslint-plugin': 5.28.8
    '@eslint/js': 10.0.1
    eslint-plugin-i18next: 6.1.5
    eslint-plugin-react-hooks: 7.1.1
    globals: 17.13.0
    typescript: 6.0.3
    typescript-eslint: 8.72.0
