on:
  pull_request_target:
    branches: [main]
jobs:
  review:
    environment: review
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Check secrets are present
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: test -n "$KEY"
